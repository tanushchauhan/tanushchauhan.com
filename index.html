<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/macbook.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Tanush Chauhan · tanushchauhan.com</title>
    <meta
      name="description"
      content="Tanush Chauhan · CS & Math @ UT Austin. A portfolio that boots like an OS."
    />
    <meta name="author" content="Tanush Chauhan" />
    <link rel="canonical" href="https://tanushchauhan.com/" />

    <!-- the wallpaper's sky, so mobile browser chrome matches the page -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2e1a47" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0616" />

    <!-- Open Graph. og:image is a screenshot of the running desktop, regenerated
         by `npm run og`. Absolute URLs are required: every scraper fetches these
         without a page to resolve them against. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="tanushchauhan.com" />
    <meta property="og:url" content="https://tanushchauhan.com/" />
    <meta property="og:title" content="Tanush Chauhan" />
    <meta
      property="og:description"
      content="CS & Math @ UT Austin. A portfolio that boots like an OS: windows, a real terminal, and live widgets."
    />
    <meta property="og:image" content="https://tanushchauhan.com/images/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A macOS-style desktop with a menu bar, widgets, project folders and an open terminal."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tanush Chauhan" />
    <meta
      name="twitter:description"
      content="CS & Math @ UT Austin. A portfolio that boots like an OS: windows, a real terminal, and live widgets."
    />
    <meta name="twitter:image" content="https://tanushchauhan.com/images/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Tanush Chauhan",
        "url": "https://tanushchauhan.com/",
        "image": "https://tanushchauhan.com/images/og.png",
        "jobTitle": "Computer Science and Mathematics student",
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "The University of Texas at Austin"
        },
        "sameAs": [
          "https://github.com/tanushchauhan",
          "https://www.linkedin.com/in/tanushchauhan"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
