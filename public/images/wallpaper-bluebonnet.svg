<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2880 1800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3f8a"/>
      <stop offset="0.38" stop-color="#3f6fc4"/>
      <stop offset="0.68" stop-color="#8fb4e4"/>
      <stop offset="0.88" stop-color="#d6e5f3"/>
      <stop offset="1" stop-color="#f2ead6"/>
    </linearGradient>
    <linearGradient id="field1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7fbe"/>
      <stop offset="1" stop-color="#39508c"/>
    </linearGradient>
    <linearGradient id="field2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5596"/>
      <stop offset="1" stop-color="#26356b"/>
    </linearGradient>
    <linearGradient id="field3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26356b"/>
      <stop offset="1" stop-color="#141d44"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6de"/>
      <stop offset="0.5" stop-color="#ffe3a6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe3a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="2880" height="1800" fill="url(#sky)"/>

  <!-- high sun, well clear of the widget column on the left -->
  <circle cx="2180" cy="430" r="520" fill="url(#haze)" opacity="0.7"/>
  <circle cx="2180" cy="430" r="86" fill="#fff8e4" opacity="0.95"/>

  <!-- a few thin clouds, flattened ellipses rather than anything fussy -->
  <g fill="#ffffff" opacity="0.34">
    <ellipse cx="620" cy="520" rx="290" ry="26"/>
    <ellipse cx="820" cy="574" rx="180" ry="18"/>
    <ellipse cx="1900" cy="700" rx="330" ry="24"/>
    <ellipse cx="1660" cy="754" rx="200" ry="17"/>
    <ellipse cx="2600" cy="600" rx="220" ry="20"/>
  </g>

  <!-- the same hill-country waves as Austin, in bluebonnet -->
  <path d="M0 1250 C 420 1130, 780 1330, 1200 1260 C 1620 1190, 2000 1350, 2440 1270 C 2660 1230, 2790 1260, 2880 1240 L 2880 1800 L 0 1800 Z" fill="url(#field1)" opacity="0.9"/>
  <path d="M0 1420 C 380 1320, 820 1500, 1300 1420 C 1780 1340, 2160 1510, 2560 1430 C 2720 1400, 2820 1420, 2880 1410 L 2880 1800 L 0 1800 Z" fill="url(#field2)" opacity="0.95"/>
  <path d="M0 1590 C 460 1500, 900 1660, 1400 1590 C 1900 1520, 2300 1680, 2880 1580 L 2880 1800 L 0 1800 Z" fill="url(#field3)"/>
</svg>
