<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2880 1800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1035"/>
      <stop offset="0.35" stop-color="#3b1d5e"/>
      <stop offset="0.62" stop-color="#8a2d5e"/>
      <stop offset="0.82" stop-color="#d45a2a"/>
      <stop offset="1" stop-color="#f7a34b"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b2450"/>
      <stop offset="1" stop-color="#3c1440"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a1a48"/>
      <stop offset="1" stop-color="#2a0f38"/>
    </linearGradient>
    <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1038"/>
      <stop offset="1" stop-color="#170a28"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8"/>
      <stop offset="0.55" stop-color="#ffb85c"/>
      <stop offset="1" stop-color="#ffb85c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="2880" height="1800" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="210" cy="140" r="2.4" opacity="0.8"/>
    <circle cx="520" cy="310" r="1.7" opacity="0.55"/>
    <circle cx="860" cy="120" r="2" opacity="0.7"/>
    <circle cx="1180" cy="260" r="1.5" opacity="0.5"/>
    <circle cx="1490" cy="90" r="2.3" opacity="0.75"/>
    <circle cx="1760" cy="330" r="1.6" opacity="0.5"/>
    <circle cx="2080" cy="150" r="2.2" opacity="0.8"/>
    <circle cx="2350" cy="280" r="1.6" opacity="0.55"/>
    <circle cx="2650" cy="110" r="2.4" opacity="0.75"/>
    <circle cx="2780" cy="360" r="1.5" opacity="0.5"/>
    <circle cx="380" cy="470" r="1.5" opacity="0.4"/>
    <circle cx="990" cy="420" r="1.4" opacity="0.4"/>
    <circle cx="1620" cy="480" r="1.4" opacity="0.35"/>
    <circle cx="2230" cy="440" r="1.5" opacity="0.4"/>
  </g>

  <!-- sun glow on the horizon -->
  <circle cx="1440" cy="1310" r="620" fill="url(#sun)" opacity="0.85"/>
  <circle cx="1440" cy="1330" r="150" fill="#ffe9b8" opacity="0.95"/>

  <!-- layered hill-country waves -->
  <path d="M0 1250 C 420 1130, 780 1330, 1200 1260 C 1620 1190, 2000 1350, 2440 1270 C 2660 1230, 2790 1260, 2880 1240 L 2880 1800 L 0 1800 Z" fill="url(#hill1)" opacity="0.9"/>
  <path d="M0 1420 C 380 1320, 820 1500, 1300 1420 C 1780 1340, 2160 1510, 2560 1430 C 2720 1400, 2820 1420, 2880 1410 L 2880 1800 L 0 1800 Z" fill="url(#hill2)" opacity="0.95"/>
  <path d="M0 1590 C 460 1500, 900 1660, 1400 1590 C 1900 1520, 2300 1680, 2880 1580 L 2880 1800 L 0 1800 Z" fill="url(#hill3)"/>
</svg>
