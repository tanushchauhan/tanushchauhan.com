<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Tanush Chauhan">
  <!-- The photo, clipped to a circle, so it drops into the dock, the boot
       screen, Contact and the phone without per-site cropping. Sized and
       offset to centre the face rather than the frame. -->
  <defs>
    <clipPath id="avatar-clip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#avatar-clip)">
    <rect width="200" height="200" fill="#1c2333"/>
    <image x="-36" y="-22.4" width="260" height="260"
           href="data:image/jpeg;base64,"/>
  </g>
  <circle cx="100" cy="100" r="99" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
</svg>
