    <circle cx="1980" cy="700" r="1.4" opacity="0.45"/>
    <circle cx="2470" cy="200" r="1.9" opacity="0.75"/>
    <circle cx="720" cy="880" r="1.3" opacity="0.4"/>
    <circle cx="1560" cy="820" r="1.3" opacity="0.4"/>
    <circle cx="60" cy="300" r="1.8" opacity="0.7"/>
    <circle cx="2870" cy="90" r="1.7" opacity="0.7"/>
