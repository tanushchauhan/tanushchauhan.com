<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2880 1800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04050e"/>
      <stop offset="0.45" stop-color="#0b0d24"/>
      <stop offset="0.75" stop-color="#1a1b3d"/>
      <stop offset="1" stop-color="#2e2555"/>
    </linearGradient>
    <linearGradient id="nhill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1d40"/>
      <stop offset="1" stop-color="#101128"/>
    </linearGradient>
    <linearGradient id="nhill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131430"/>
      <stop offset="1" stop-color="#0a0b1e"/>
    </linearGradient>
    <linearGradient id="nhill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c20"/>
      <stop offset="1" stop-color="#050510"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
