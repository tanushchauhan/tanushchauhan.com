  <!-- moon -->
  <circle cx="2160" cy="430" r="400" fill="url(#moonglow)"/>
  <circle cx="2160" cy="430" r="88" fill="#eef1ff"/>
  <circle cx="2130" cy="405" r="14" fill="#ccd2ef" opacity="0.7"/>
  <circle cx="2192" cy="452" r="10" fill="#ccd2ef" opacity="0.6"/>
  <circle cx="2150" cy="470" r="7" fill="#ccd2ef" opacity="0.5"/>

  <!-- layered hills -->
  <path d="M0 1250 C 420 1130, 780 1330, 1200 1260 C 1620 1190, 2000 1350, 2440 1270 C 2660 1230, 2790 1260, 2880 1240 L 2880 1800 L 0 1800 Z" fill="url(#nhill1)"/>
  <path d="M0 1420 C 380 1320, 820 1500, 1300 1420 C 1780 1340, 2160 1510, 2560 1430 C 2720 1400, 2820 1420, 2880 1410 L 2880 1800 L 0 1800 Z" fill="url(#nhill2)"/>

