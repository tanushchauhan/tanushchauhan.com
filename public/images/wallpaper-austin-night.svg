    <circle cx="2620" cy="620" r="1.6" opacity="0.6"/>
    <circle cx="2780" cy="360" r="1.5" opacity="0.6"/>
    <circle cx="380" cy="470" r="1.5" opacity="0.55"/>
    <circle cx="990" cy="420" r="1.4" opacity="0.55"/>
    <circle cx="1620" cy="480" r="1.4" opacity="0.5"/>
    <circle cx="2230" cy="440" r="1.5" opacity="0.55"/>
    <circle cx="140" cy="720" r="1.6" opacity="0.5"/>
    <circle cx="680" cy="640" r="1.4" opacity="0.5"/>
