      <stop offset="0.4" stop-color="#aab4e8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#aab4e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="2880" height="1800" fill="url(#nsky)"/>

