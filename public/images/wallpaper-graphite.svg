<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2880 1800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f4f1ec"/>
      <stop offset="0.55" stop-color="#e2ded8"/>
      <stop offset="1" stop-color="#cfc9c1"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9c6d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b9c6d8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- no scenery at all: the one to pick when the windows are the subject -->
  <rect width="2880" height="1800" fill="url(#base)"/>
  <ellipse cx="2260" cy="420" rx="1180" ry="900" fill="url(#warm)"/>
  <ellipse cx="420" cy="1560" rx="1320" ry="820" fill="url(#cool)"/>
</svg>
