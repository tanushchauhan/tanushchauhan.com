# Local development only; production runs on Coolify.
#
#   docker compose up -d db     Postgres for `npm run dev` + `npm run dev:api`
#   docker compose up --build   also build and run the real image

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tanush
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: tanushchauhan
    ports:
      # bound to loopback so the dev database is never exposed on the LAN
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanush -d tanushchauhan"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://tanush:localdev@db:5432/tanushchauhan
      # WebAuthn is origin-bound; localhost is a valid secure origin for testing
      RP_ID: localhost
      ORIGIN: http://localhost:3001
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
