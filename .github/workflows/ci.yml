name: CI

# Coolify deploys main without waiting for this, so a red run is a warning, not a gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun.lock is the lockfile for both the frontend and the server
      - name: install
        run: bun install --frozen-lockfile

      - name: install server deps
        run: bun install --frozen-lockfile
        working-directory: server

      - name: typecheck the server
        run: bun run typecheck
        working-directory: server

      - name: build
        run: bun run build

  test:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # the test runner is a node script
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install
        run: bun install --frozen-lockfile

      - name: install chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: test
        run: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: keep the screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
          retention-days: 7
